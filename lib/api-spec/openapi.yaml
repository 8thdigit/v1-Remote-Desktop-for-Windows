openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /msfwr/invite:
    post:
      operationId: createMsfwrInvite
      responses:
        "201":
          description: One-time host invite
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MsfwrInvite"}
  /msfwr/standing:
    post:
      operationId: registerMsfwrStanding
      description: >-
        Unattended host registration. The access code is derived from the
        host's saved key; a viewer that joins it is live without approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MsfwrStandingKey"}
      responses:
        "201":
          description: Pre-approved host invite for the derived code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MsfwrInvite"}
  /msfwr/call:
    post:
      operationId: callMsfwr
      security: [{sessionToken: []}]
      description: >-
        An unattended host presses Initiate. Viewers that already know its
        access code see the request for two minutes and accept it by joining.
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MsfwrCall"}
      responses:
        "204": {description: Request is visible to viewers that know the code}
  /msfwr/calls:
    post:
      operationId: listMsfwrCalls
      description: >-
        Which of the viewer's saved access codes have a pending Initiate
        request, and which of them are online (waiting) or in a session.
        Codes that are not listed are offline.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MsfwrCallQuery"}
      responses:
        "200":
          description: Pending requests among the given codes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MsfwrCallList"}
  /msfwr/link/create:
    post:
      operationId: createMsfwrLink
      description: >-
        Create a shareable remote access URL from the client app. The host PC
        registers a waiting session under the link's code; every viewer that
        opens the shared URL starts a new session without approval, until the
        link expires (24 hours by default) or is revoked. Requires the
        unattended access key of the PC.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MsfwrLinkCreate"}
      responses:
        "201":
          description: The created link
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MsfwrLink"}
  /msfwr/link/register:
    post:
      operationId: registerMsfwrLink
      description: >-
        The host re-registers its waiting session under an existing link id
        after each session ends, so the shared URL keeps accepting viewers
        until it expires or is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MsfwrLinkRegister"}
      responses:
        "201":
          description: Pre-approved host invite for the link's code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MsfwrInvite"}
        "410": {description: The link expired or was revoked}
  /msfwr/link/status:
    get:
      operationId: getMsfwrLinkStatus
      description: >-
        Current state of a link for the client app: validity, whether the
        host is registered and online, and how many sessions were opened.
      parameters:
        - {in: query, name: id, required: true, schema: {type: string}}
        - {in: query, name: key, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}}
      responses:
        "200":
          description: Link status
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MsfwrLinkStatus"}
  /msfwr/link/revoke:
    post:
      operationId: revokeMsfwrLink
      description: Revoke a link at once; any live session under it is ended.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MsfwrLinkRegister"}
      responses:
        "204": {description: Link revoked}
  /msfwr/join:
    post:
      operationId: joinMsfwr
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MsfwrCode"}
      responses:
        "200":
          description: Viewer capability and verification number
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MsfwrViewer"}
  /msfwr/end:
    post:
      operationId: endMsfwr
      security: [{sessionToken: []}]
      responses:
        "204": {description: Session ended}
  /msfwr/input:
    post:
      operationId: sendMsfwrInput
      security: [{sessionToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MsfwrInput"}
      responses:
        "204": {description: Accepted}
  /msfwr/approve:
    post:
      operationId: approveMsfwr
      security: [{sessionToken: []}]
      responses:
        "204": {description: Host approved the session}
  /msfwr/tick:
    post:
      operationId: tickMsfwr
      security: [{sessionToken: []}]
      description: Host heartbeat; optional raw JPEG body when the approved screen changes.
      requestBody:
        content:
          image/jpeg:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Host status and pending input
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MsfwrTick"}
  /msfwr/frame:
    get:
      operationId: getMsfwrFrame
      security: [{sessionToken: []}]
      parameters:
        - {in: query, name: after, schema: {type: integer, minimum: 0}}
      responses:
        "200":
          description: New JPEG frame; X-Msfwr-Frame is its sequence number.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "204":
          description: No new frame. X-Msfwr-State is pending or live.
components:
  securitySchemes:
    sessionToken: { type: http, scheme: bearer }
  schemas:
    MsfwrTick:
      type: object
      required: [state, input]
      properties:
        state: {type: string, enum: [waiting, pending, live]}
        verification: {type: string}
        input:
          type: array
          items: {$ref: "#/components/schemas/MsfwrInput"}
    MsfwrCode:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[A-F0-9]{12}$'}
    MsfwrStandingKey:
      type: object
      required: [key]
      properties:
        key: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        name: {type: string, maxLength: 64}
    MsfwrCall:
      type: object
      properties:
        name: {type: string, maxLength: 64}
    MsfwrCallQuery:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          maxItems: 50
          items: {type: string, pattern: '^[A-F0-9]{12}$'}
    MsfwrCallList:
      type: object
      required: [calls]
      properties:
        calls:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: {type: string}
              name: {type: string}
        presence:
          type: array
          items:
            type: object
            required: [code, name, state]
            properties:
              code: {type: string}
              name: {type: string}
              state: {type: string, enum: [online, busy]}
    MsfwrInvite:
      type: object
      required: [code, token]
      properties:
        code: {type: string}
        token: {type: string}
    MsfwrLinkCreate:
      type: object
      required: [key]
      properties:
        key: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        name: {type: string, maxLength: 64}
        ttlHours: {type: integer, enum: [1, 2, 4, 5, 8, 12, 24, 48, 72, 120], default: 24}
    MsfwrLinkRegister:
      type: object
      required: [id, key]
      properties:
        id: {type: string, maxLength: 64}
        key: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
    MsfwrLink:
      type: object
      required: [id, code, name, createdAt, expiresAt, sessions]
      properties:
        id: {type: string}
        code: {type: string, pattern: '^L[0-9A-F]{11}$'}
        name: {type: string}
        createdAt: {type: number}
        expiresAt: {type: number}
        sessions: {type: integer, minimum: 0}
    MsfwrLinkStatus:
      type: object
      required: [link, online, busy]
      properties:
        link: {$ref: "#/components/schemas/MsfwrLink"}
        online: {type: boolean}
        busy: {type: boolean}
    MsfwrViewer:
      type: object
      required: [token, verification, preapproved]
      properties:
        token: {type: string}
        verification: {type: string}
        preapproved: {type: boolean}
    MsfwrInput:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [key, wheel, down, up, move, release]}
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        button: {type: integer, minimum: 0, maximum: 2}
        delta: {type: integer, enum: [-1, 1]}
        key: {type: string, maxLength: 24}
        ctrl: {type: boolean}
        shift: {type: boolean}
        alt: {type: boolean}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

