openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      description: The signed-in portal user, or whether the first admin still has to be created.
      responses:
        "200":
          description: Login state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthStatus"}
  /auth/setup:
    post:
      operationId: setupAdmin
      tags: [auth]
      description: >-
        Creates the first admin account. Only works while no account exists,
        and needs the one-time setup code the relay writes to its log.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthSetup"}
      responses:
        "201":
          description: Admin created and signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthLogin"}
      responses:
        "200":
          description: Signed in; the session is an HttpOnly cookie
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204": {description: Signed out}
  /auth/password:
    post:
      operationId: changePassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordChange"}
      responses:
        "204": {description: Password changed; other logins are signed out}
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      responses:
        "200":
          description: Every portal account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountList"}
    post:
      operationId: createUser
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccountCreate"}
      responses:
        "201":
          description: Account created with a new RA ID
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccountUpdate"}
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Account"}
    delete:
      operationId: deleteUser
      tags: [admin]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "204": {description: Account deleted}
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      responses:
        "200":
          description: Live sessions, requests and recent activity
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminOverview"}
  /admin/sessions/{id}/end:
    post:
      operationId: endSessionAsAdmin
      tags: [admin]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "204": {description: Session ended}
  /deskline/inbox:
    get:
      operationId: getDesklineInbox
      description: Initiate requests that PCs sent to the signed-in user's RA ID.
      responses:
        "200":
          description: Open and recent requests
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DesklineInbox"}
  /deskline/accept:
    post:
      operationId: acceptDesklineRequest
      description: Accepts a request sent to the signed-in user's RA ID and joins that PC.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DesklineAccept"}
      responses:
        "200":
          description: Viewer capability
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DesklineViewer"}
  /deskline/inputs:
    post:
      operationId: sendDesklineInputs
      security: [{sessionToken: []}]
      description: Several viewer input events in order, in one request.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DesklineInputBatch"}
      responses:
        "204": {description: Accepted}
  /deskline/pull:
    post:
      operationId: pullDesklineInput
      security: [{sessionToken: []}]
      description: >-
        Host long poll for viewer input. Returns as soon as input is queued,
        or after about ten seconds with none.
      responses:
        "200":
          description: Session state and input
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DesklineTick"}
  /deskline/invite:
    post:
      operationId: createDesklineInvite
      responses:
        "201":
          description: One-time host invite
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DesklineInvite"}
  /deskline/standing:
    post:
      operationId: registerDesklineStanding
      description: >-
        Unattended host registration. The access code is derived from the
        host's saved key; a viewer that joins it is live without approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DesklineStandingKey"}
      responses:
        "201":
          description: Pre-approved host invite for the derived code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DesklineInvite"}
  /deskline/call:
    post:
      operationId: callDeskline
      security: [{sessionToken: []}]
      description: >-
        An unattended host presses Initiate. Viewers that already know its
        access code see the request for two minutes and accept it by joining.
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DesklineCall"}
      responses:
        "204": {description: Request is visible to viewers that know the code}
  /deskline/calls:
    post:
      operationId: listDesklineCalls
      description: >-
        Which of the viewer's saved access codes have a pending Initiate
        request, and which of them are online (waiting) or in a session.
        Codes that are not listed are offline.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DesklineCallQuery"}
      responses:
        "200":
          description: Pending requests among the given codes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DesklineCallList"}
  /deskline/join:
    post:
      operationId: joinDeskline
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DesklineCode"}
      responses:
        "200":
          description: Viewer capability and verification number
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DesklineViewer"}
  /deskline/end:
    post:
      operationId: endDeskline
      security: [{sessionToken: []}]
      responses:
        "204": {description: Session ended}
  /deskline/input:
    post:
      operationId: sendDesklineInput
      security: [{sessionToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DesklineInput"}
      responses:
        "204": {description: Accepted}
  /deskline/approve:
    post:
      operationId: approveDeskline
      security: [{sessionToken: []}]
      responses:
        "204": {description: Host approved the session}
  /deskline/tick:
    post:
      operationId: tickDeskline
      security: [{sessionToken: []}]
      description: Host heartbeat; optional raw JPEG body when the approved screen changes.
      requestBody:
        content:
          image/jpeg:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Host status and pending input
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DesklineTick"}
  /deskline/frame:
    get:
      operationId: getDesklineFrame
      security: [{sessionToken: []}]
      parameters:
        - {in: query, name: after, schema: {type: integer, minimum: 0}}
        - {in: query, name: wait, description: Hold the request up to this many milliseconds for a new frame., schema: {type: integer, minimum: 0, maximum: 10000}}
      responses:
        "200":
          description: New JPEG frame; X-Deskline-Frame is its sequence number.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        "204":
          description: No new frame. X-Deskline-State is pending or live.
components:
  securitySchemes:
    sessionToken: { type: http, scheme: bearer }
  schemas:
    DesklineTick:
      type: object
      required: [state, input]
      properties:
        state: {type: string, enum: [waiting, pending, live]}
        verification: {type: string}
        input:
          type: array
          items: {$ref: "#/components/schemas/DesklineInput"}
    DesklineCode:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[A-F0-9]{12}$'}
    DesklineStandingKey:
      type: object
      required: [key]
      properties:
        key: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        name: {type: string, maxLength: 64}
    DesklineCall:
      type: object
      properties:
        name: {type: string, maxLength: 64}
        ra: {type: string, maxLength: 16, description: RA ID of the portal user who should get the request}
    DesklineCallQuery:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          maxItems: 50
          items: {type: string, pattern: '^[A-F0-9]{12}$'}
    DesklineCallList:
      type: object
      required: [calls]
      properties:
        calls:
          type: array
          items:
            type: object
            required: [code, name]
            properties:
              code: {type: string}
              name: {type: string}
        presence:
          type: array
          items:
            type: object
            required: [code, name, state]
            properties:
              code: {type: string}
              name: {type: string}
              state: {type: string, enum: [online, busy]}
    DesklineInvite:
      type: object
      required: [code, token]
      properties:
        code: {type: string}
        token: {type: string}
    DesklineViewer:
      type: object
      required: [token, verification, preapproved]
      properties:
        token: {type: string}
        verification: {type: string}
        preapproved: {type: boolean}
    DesklineInput:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [key, wheel, down, up, move, release]}
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        button: {type: integer, minimum: 0, maximum: 2}
        delta: {type: integer, enum: [-1, 1]}
        key: {type: string, maxLength: 24}
        ctrl: {type: boolean}
        shift: {type: boolean}
        alt: {type: boolean}
    Account:
      type: object
      required: [id, username, displayName, role, raId, disabled, createdAt]
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        role: {type: string, enum: [admin, ra]}
        raId: {type: string}
        disabled: {type: boolean}
        createdAt: {type: number}
        lastLoginAt: {type: number}
    AccountList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: {$ref: "#/components/schemas/Account"}
    AccountCreate:
      type: object
      required: [username, password, role]
      properties:
        username: {type: string, maxLength: 32}
        displayName: {type: string, maxLength: 60}
        password: {type: string, maxLength: 200}
        role: {type: string, enum: [admin, ra]}
    AccountUpdate:
      type: object
      properties:
        displayName: {type: string, maxLength: 60}
        password: {type: string, maxLength: 200}
        role: {type: string, enum: [admin, ra]}
        disabled: {type: boolean}
    AuthStatus:
      type: object
      required: [setupRequired]
      properties:
        setupRequired: {type: boolean}
        user: {$ref: "#/components/schemas/Account"}
    AuthSetup:
      type: object
      required: [setupCode, username, password]
      properties:
        setupCode: {type: string, maxLength: 64}
        username: {type: string, maxLength: 32}
        displayName: {type: string, maxLength: 60}
        password: {type: string, maxLength: 200}
    AuthLogin:
      type: object
      required: [username, password]
      properties:
        username: {type: string, maxLength: 64}
        password: {type: string, maxLength: 200}
    PasswordChange:
      type: object
      required: [current, next]
      properties:
        current: {type: string, maxLength: 200}
        next: {type: string, maxLength: 200}
    Operator:
      type: object
      required: [id, name, raId]
      properties:
        id: {type: string}
        name: {type: string}
        raId: {type: string}
    DesklineRequest:
      type: object
      required: [id, name, mode, at, until, status]
      properties:
        id: {type: string}
        name: {type: string}
        mode: {type: string, enum: [unattended, attended]}
        at: {type: number}
        until: {type: number}
        status: {type: string, enum: [waiting, accepted, missed]}
        closedAt: {type: number}
        ra: {type: string}
        acceptedBy: {$ref: "#/components/schemas/Operator"}
    DesklineInbox:
      type: object
      required: [raId, requests]
      properties:
        raId: {type: string}
        requests:
          type: array
          items: {$ref: "#/components/schemas/DesklineRequest"}
    DesklineAccept:
      type: object
      required: [id]
      properties:
        id: {type: string, maxLength: 40}
    DesklineInputBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: "#/components/schemas/DesklineInput"}
    AdminSession:
      type: object
      required: [id, name, mode, state, createdAt, frames, bytes]
      properties:
        id: {type: string}
        name: {type: string}
        mode: {type: string, enum: [unattended, attended]}
        state: {type: string, enum: [waiting, pending, live]}
        operator: {$ref: "#/components/schemas/Operator"}
        createdAt: {type: number}
        liveAt: {type: number}
        frames: {type: integer}
        bytes: {type: number}
    AdminActivity:
      type: object
      required: [at, kind, text]
      properties:
        at: {type: number}
        kind: {type: string}
        actor: {type: string}
        text: {type: string}
    AdminOverview:
      type: object
      required: [live, hosts, requests, activity, storage]
      properties:
        live:
          type: array
          items: {$ref: "#/components/schemas/AdminSession"}
        hosts:
          type: object
          required: [unattended, attended]
          properties:
            unattended: {type: integer}
            attended: {type: integer}
        requests:
          type: array
          items: {$ref: "#/components/schemas/DesklineRequest"}
        activity:
          type: array
          items: {$ref: "#/components/schemas/AdminActivity"}
        storage: {type: string}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

