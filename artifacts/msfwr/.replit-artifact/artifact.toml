kind = "web"
previewPath = "/"
title = "Msfwr"
description = "Browser viewer and Windows installer for attended remote desktop support over HTTPS."
version = "1.0.0"
id = "artifacts/msfwr"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18451

[services.development]
run = "pnpm --filter @workspace/msfwr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/msfwr", "run", "build" ]
serve = "static"
publicDir = "artifacts/msfwr/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18451"
BASE_PATH = "/"
