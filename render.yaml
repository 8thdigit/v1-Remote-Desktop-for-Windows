# Render Blueprint for the Msfwr relay (artifacts/api-server).
# The relay keeps sessions in process memory, so it must run as ONE
# always-on instance. Do not scale it above 1 instance.
services:
  - type: web
    name: msfwr-relay
    runtime: node
    plan: starter # free also works, but it sleeps after 15 idle minutes
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    numInstances: 1
    autoDeploy: true
    # Login accounts (companies, admins) are saved to this disk. Without a
    # disk or DATABASE_URL they are lost on every deploy.
    disk:
      name: msfwr-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: MSFWR_DATA_DIR
        value: /var/data
      # Signs login cookies; keep it stable so sign-ins survive restarts.
      - key: SESSION_SECRET
        generateValue: true
      # The first admin account (login ID "admin" unless ADMIN_USERNAME is
      # set) is created from this when no account exists yet. Without it the
      # admin starts with the default PIN 121212 and must change it at first
      # sign-in.
      - key: ADMIN_PASSWORD
        sync: false
      # The six-digit PIN the admin console asks for before it creates a Connect.AI
      # admin account or makes an account an admin. Set it in the Render
      # dashboard; admin creation stays off until it is set.
      - key: ADMIN_CREATION_PIN
        sync: false
