name: Release installer

# Builds the Windows installer and attaches it to a GitHub release. The site's
# Download button links to releases/latest, so a new release is live there at once.
#
# It runs by itself whenever a change to the Windows host lands on main. The
# version comes from windows-host/VERSION; once that version is released, later
# runs bump the patch number (0.6.0, 0.6.1, ...). Edit VERSION to start a new
# minor or major line. You can also run it from the Actions tab with a tag, or
# push a tag such as v0.7.0.
on:
  push:
    branches: [main]
    paths: ['windows-host/**', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, for example v0.1.0'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

concurrency:
  group: release-installer
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            base="v$(tr -d '[:space:]' < windows-host/VERSION)"
            if ! gh release view "$base" >/dev/null 2>&1; then
              tag="$base"
            else
              # Newest released patch on this VERSION line, plus one.
              latest="$(git tag -l "${base%.*}.*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)"
              patch="${latest##*.}"
              tag="${base%.*}.$((patch + 1))"
            fi
          fi
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.+-]*)?$ ]]; then
            echo "Not a release tag: $tag" >&2; exit 1
          fi
          echo "Releasing $tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows-host/go.mod
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Test
        working-directory: windows-host
        run: go test ./...
      - name: Build installer
        env:
          MSFWR_VERSION: ${{ env.TAG }}
        run: bash windows-host/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=artifacts/msfwr/public/downloads/msfwr-Setup-x64.exe
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
          else
            gh release create "$TAG" "$file" --target "$GITHUB_SHA" --title "WINRSS.net $TAG" \
              --notes "Windows 10/11 x64 installer for the WINRSS.net host. This preview installer is unsigned, so Windows SmartScreen may warn before it runs."
          fi
